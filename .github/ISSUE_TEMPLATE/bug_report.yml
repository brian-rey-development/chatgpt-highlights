name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a chat on chatgpt.com
        2. Select a passage
        3. ...
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chrome
        - Firefox
        - Other Chromium browser
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Browser and extension version
      placeholder: Chrome 131, extension 0.1.2
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or console errors
